<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primavera PM System</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: file:;">
  <script>
    // Browser environment polyfills
    if (typeof global === 'undefined') {
      window.global = window;
    }
    if (typeof require === 'undefined') {
      window.require = function(module) {
        // ブラウザ環境では何も返さない
        return {};
      };
    }
    if (typeof process === 'undefined') {
      window.process = {
        env: {},
        browser: true,
        version: '',
        versions: { node: '0.0.0' }
      };
    }
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    /* ローディング画面 */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #1976d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .loading-subtext {
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- 初期ローディング画面 -->
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Primavera PM System</div>
      <div class="loading-subtext">アプリケーションを起動しています...</div>
    </div>
  </div>
</body>
</html>
